<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- On Android the popup opens as a page over the whole window, and a page
         without this meta is laid out at 980px and shrunk to fit. The desktop
         panel ignores it. -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>re/read</title>
    <link rel="stylesheet" href="../assets/page.css" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <!--
      Five rows and nothing else: this site, the pair, the reader, the reading
      list, the door to the settings. No counters, no logo - the popup is a
      hallway, not a room.
    -->
    <label class="popup-row popup-site" id="site-row" hidden>
      <span class="popup-host" id="site-host"></span>
      <input type="checkbox" id="site-toggle" title="Whether re/read runs on this site" />
    </label>
    <p class="popup-row popup-note" id="site-note" hidden>re/read does not work on this page.</p>

    <label class="popup-row popup-pair" id="pair-row">
      <span>Language pair</span>
      <select id="pair"></select>
    </label>

    <button type="button" class="popup-row popup-action" id="open-reader">
      Read this page in the reader
    </button>
    <!-- Stays even over the reader itself: there it turns the reader to the
         list, which is exactly what the press means. -->
    <button type="button" class="popup-row popup-action" id="open-library">Reading list</button>
    <button type="button" class="popup-row popup-action" id="open-settings">Settings</button>

    <!-- Below the four rows, and only while the mode is on: on Android the
         popup is the extension's main surface, and the mode has to be readable
         from it. Pressing it leads where the mode is changed. -->
    <button type="button" class="popup-row popup-action popup-mode" id="mode-line" hidden>
      Mode: only in the reader
    </button>

    <script src="index.js" defer></script>
  </body>
</html>
