<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- On Android the popup opens as a page over the whole window, and a page
         without this meta is laid out at 980px and shrunk to fit. The desktop
         panel ignores it. -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>re/read</title>
    <link rel="stylesheet" href="../assets/page.css" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <!--
      Ten rows and nothing else: this site and what to do with it first, the
      three reading preferences, the extension's own pages, and the quiet
      heart. No counters, no logo - the popup is a hallway, not a room. On a
      fresh install the pair row yields its place to a signpost, because a
      pair nothing can translate yet is a promise the popup must not make.
    -->
    <!-- The English in this file is the fallback: `localizePage` swaps every
         `data-i18n`-marked text for the catalogue's language before the popup
         is seen. A marked element holds text only - the locales test enforces
         that, because the swap goes through `textContent`. -->
    <!-- The label text carries the hostname inside it ("Enabled on ..."), so
         the script builds it from the catalogue; no fallback stands here. -->
    <label class="popup-row popup-site" id="site-row" hidden>
      <span class="popup-site-label" id="site-label"></span>
      <input
        type="checkbox"
        id="site-toggle"
        title="Whether re/read runs on this site"
        data-i18n-title="popup_site_toggle_title"
      />
    </label>
    <p class="popup-row popup-note" id="site-note" data-i18n="popup_no_page" hidden>
      re/read does not work on this page.
    </p>

    <!-- Second from the top (Michał's call, 2026-08-17): the row most presses
         come for, right under the site it acts on - and the one row wearing a
         drawn glyph (his call too, same day): a page of prose, the reading
         view's own association, in the accent that says "start here". The
         glyph stands outside the marked span (`localizePage` swaps text only)
         and outside the accessible name. Stays even over the reader itself:
         there it turns the reader to the list, which is exactly what the
         press means. -->
    <button type="button" class="popup-row popup-action popup-reader" id="open-reader">
      <svg class="popup-icon" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
        <rect
          x="3"
          y="2.25"
          width="10"
          height="11.5"
          rx="1.5"
          fill="none"
          stroke="currentColor"
          stroke-width="1.3"
        />
        <path
          d="M5.5 5.5h5M5.5 8h5M5.5 10.5h3"
          fill="none"
          stroke="currentColor"
          stroke-width="1.3"
          stroke-linecap="round"
        />
      </svg>
      <span data-i18n="open_reader">Read this page in the reader</span>
    </button>

    <label class="popup-row popup-pair" id="pair-row">
      <span data-i18n="language_pair">Language pair</span>
      <select id="pair"></select>
    </label>
    <!-- Stands in the pair row's place while no model is stored at all. The
         whole row is a door: pressing it opens the settings, where the
         choosing and the downloading happen. -->
    <button type="button" class="popup-row popup-action popup-setup" id="setup-row" data-i18n="popup_no_model" hidden>
      No translation model on this device yet - press here to pick one in the settings.
    </button>
    <!-- Stands where the pair row would: with translation switched off (D120)
         this is the popup's one word about why nothing translates, so the
         state never reads as a breakage. A quiet note, not a switch - the
         choice is a deliberate one and lives on the settings page. -->
    <p class="popup-row popup-note" id="translation-off-note" data-i18n="popup_translation_off" hidden>
      Translation is switched off - re/read is working as a reader. Turn it back on in the
      settings.
    </p>

    <!-- The extension's rooms right under the pair (Michał's call, second
         round 2026-08-17): the rows visited often stand above the switches
         flipped rarely. Settings stays below, at the preferences' side - it
         is their own room. -->
    <button type="button" class="popup-row popup-action" id="open-library" data-i18n="reading_list">
      Offline reading list
    </button>
    <!-- The highlights page (D108), by the row the pages' menus carry: the
         reader tab turned to every kept quote. -->
    <button type="button" class="popup-row popup-action" id="open-marks" data-i18n="reader_marks_title">
      Highlights
    </button>
    <button type="button" class="popup-row popup-action" id="open-vocabulary" data-i18n="saved_phrases">
      Saved phrases
    </button>

    <!-- The quiet-bubble switch (D81), here as well as in the settings: it is
         a reading preference somebody flips mid-article, and the popup is the
         surface already in reach. Save shows itself regardless - the hint for
         that lives on the settings page, where there is room to say it. -->
    <label class="popup-row popup-quiet" id="quiet-row">
      <span data-i18n="quiet_bubble">Hide bubble actions by default</span>
      <input type="checkbox" id="quiet-bubble" />
    </label>

    <!-- The reader-only switch, for the quiet bubble's reason: a mode flipped
         depending on what is being read, and the popup is the surface in
         reach. It replaces the status line that used to stand at the bottom -
         a switch says the state and changes it in one row, where the line
         could only point at the settings. The hint stays on the settings
         page, where there is room to say it. -->
    <label class="popup-row popup-reader-only" id="reader-only-row">
      <span data-i18n="options_reader_only">Only in the reader</span>
      <input type="checkbox" id="reader-only" />
    </label>

    <button type="button" class="popup-row popup-action" id="open-settings" data-i18n="settings">
      Settings
    </button>

    <!-- The quietest row, and the last: the one outward door in the popup,
         to the foundation's support page - a thank-you to press, never a
         toll. The heart stands outside the marked span (`localizePage` swaps
         text only) and outside the accessible name: the word is the name,
         the heart is the dress. -->
    <button type="button" class="popup-row popup-action popup-support" id="open-support">
      <span class="support-heart" aria-hidden="true">&#9829;</span>
      <span data-i18n="support">Support</span>
    </button>

    <script src="index.js" defer></script>
  </body>
</html>
