<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>re/read - reader</title>
    <link rel="stylesheet" href="../assets/page.css" />
    <link rel="stylesheet" href="reader.css" />
    <!--
      The same one file that goes onto every page being read: the underline
      under a saved phrase has to look identical here, and one stylesheet is how
      that stays true without anybody remembering to change two.
    -->
    <link rel="stylesheet" href="../content/highlight.css" />
  </head>
  <body class="reader">
    <header class="reader-bar">
      <span class="reader-mark">re/read</span>
      <span class="reader-tools">
        <a id="original" class="reader-original" hidden>Open the original</a>
        <button id="display" type="button" aria-expanded="false" title="Type and theme">Aa</button>
      </span>
    </header>

    <!--
      Written out here rather than built by script: what the reader can change
      about its own appearance is a short, fixed list, and a list is easier to
      read in the package than the code that would have produced it.
    -->
    <section id="display-panel" class="reader-panel" hidden aria-label="Type and theme">
      <div class="reader-setting">
        <span class="reader-setting-name">Theme</span>
        <span class="reader-choices" id="theme-choices">
          <button type="button" data-theme="auto">Auto</button>
          <button type="button" data-theme="light">Light</button>
          <button type="button" data-theme="sepia">Sepia</button>
          <button type="button" data-theme="dark">Dark</button>
        </span>
      </div>

      <div class="reader-setting">
        <span class="reader-setting-name">Type</span>
        <span class="reader-choices" id="font-choices">
          <button type="button" data-font="serif">Serif</button>
          <button type="button" data-font="sans">Sans</button>
        </span>
      </div>

      <div class="reader-setting">
        <span class="reader-setting-name">Size</span>
        <span class="reader-choices">
          <button type="button" data-size="-1" title="Smaller">&minus;</button>
          <output id="size-value">18</output>
          <button type="button" data-size="1" title="Larger">+</button>
        </span>
      </div>

      <div class="reader-setting">
        <span class="reader-setting-name">Width</span>
        <span class="reader-choices">
          <button type="button" data-measure="-5" title="Narrower">&minus;</button>
          <output id="measure-value">65</output>
          <button type="button" data-measure="5" title="Wider">+</button>
        </span>
      </div>
    </section>

    <main id="page">
      <p id="notice" class="note">
        Press the toolbar button on a page you want to read, and the article shows up here.
        Selecting a phrase works exactly as it does on any other page.
      </p>

      <article id="article" hidden>
        <h1 id="title"></h1>
        <p id="byline" class="reader-byline" hidden></p>
        <div id="content"></div>
      </article>
    </main>

    <!--
      The extractor, exactly as its authors published it: vendored byte for byte
      and loaded as its own file, so what ships hashes to what they released.
      See vendor/readability/README.md.
    -->
    <script src="../vendor/readability/Readability.js"></script>
    <script src="reader.js" defer></script>
  </body>
</html>
